# dsh-shixu-channel 的挂载清单。bundle 只做组合，不承载逻辑：
# 每一行都是可单独启停的插件，行与行之间只通过 service 名相连。
- insert:
    - id: shixu-channels
      name: 'dsh-shixu-channel'

    - id: shixu-driver-fake
      name: 'dsh-shixu-channel/driver-fake'

    # 人格的配置面在这一行的 config 里：personaId（默认 default）、
    # provider / model / reasoningEffort（留空 = 跟随部署默认）、
    # venues（场所覆盖表，空 = 所有场所都在场）。
    - id: shixu-channel-binding
      name: 'dsh-shixu-channel/binding'
